<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contactos | SuperAuto Sport</title>
  <meta name="description" content="Peça informações sobre uma viatura ou solicite um test drive.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/formularios.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>
  <header class="cabecalho" id="cabecalho"></header>

  <main id="conteudo" tabindex="-1">
    <div class="contentor cabeca-pagina">
      <h1>Contactos</h1>
    </div>

    <div class="contentor contactos-pagina">
      <div class="contactos-pagina__intro">
        <p>Peça informações sobre uma viatura ou solicite um test drive. Um pedido não é uma marcação: o stand entra em contacto consigo para combinar os detalhes.</p>
        <div id="contactos-stand"></div>
      </div>

      <div class="cartao-formulario">
        <div class="separadores" role="tablist" aria-label="Tipo de pedido">
          <button class="separador" role="tab" id="separador-contacto" aria-controls="painel-contacto" aria-selected="true" type="button">Pedir informações</button>
          <button class="separador" role="tab" id="separador-test-drive" aria-controls="painel-test-drive" aria-selected="false" tabindex="-1" type="button">Pedir test drive</button>
        </div>

        <div id="painel-contacto" role="tabpanel" aria-labelledby="separador-contacto"></div>
        <div id="painel-test-drive" role="tabpanel" aria-labelledby="separador-test-drive" hidden></div>
      </div>
    </div>
  </main>

  <footer class="rodape sobre-escuro" id="rodape"></footer>
  <script type="module" src="js/pages/contactos.js"></script>
</body>
</html>
